[package]
name = "nexus-irc-tui"
version = "2.0.0-alpha10.3"
edition = "2021"
description = "Old-school IRC-style local terminal interface for QSOL NEXUS"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossterm = "0.29.0"
csv = "1.4.0"
pdf-extract = "0.12.0"
serde_json = "1.0"
unicode-width = "0.2.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[lib]
name = "nexus_irc_tui"
path = "src/lib.rs"

[[bin]]
name = "nexus"
path = "src/main.rs"
