# NEXUS YAML Doctoral Citizenship Curriculum
#
# Derived from the defensive YAML Doctoral Qualifying Examination v4 in
# QSOLKCB/HERESY-SEC. This remains REFERENCE DATA, not authoritative runtime
# input. Every expected answer is quoted so this question bank does not depend
# on implicit YAML typing.
#
# Candidate instruction:
#   This examination is open-specification. Confidence without justification
#   will be penalized.

schema_version: "nexus-citizenship-yaml-curriculum/2"
source: "YAML Doctoral Qualifying Examination v4"
source_repository: "QSOLKCB/HERESY-SEC"
source_commit: "451b201d9bc83c810298557f93eff0a880422d9e"
source_sha256: "fa440e63da4cad5943ed1df2a7b7be5c6d4dd69d885a2419ebd9ad6993751125"
source_bytes: "50695"
source_lines: "1381"
runtime_authoritative: "false"

candidate_contract:
  - "This examination is open-specification."
  - "Confidence without justification will be penalized."
  - "For every non-trivial parser claim, name parser, exact version, loader/schema, observed result, and pipeline stage."
  - "Separate specification behavior from implementation behavior."
  - "Treat host-language equality and mapping behavior as a separate construction layer, not as YAML syntax."
  - "Never claim two YAML parsers are basically the same."
  - "Never use an unsafe general YAML loader on untrusted input."
  - "Quote ambiguous scalars at portable data boundaries."
  - "Pin parser and schema behavior when multiple languages exchange YAML."

pipeline_stages:
  scanner: "tokens-indentation-indicators-escapes"
  parser: "events-block-flow-context-document-boundaries-directives"
  composer: "nodes-anchors-aliases-graph-identity"
  resolver: "implicit-tag-selection-schema-dependent-rules"
  constructor: "host-language-values-hashability-merges-key-collisions"
  representer_dumper: "serialization-presentation-and-round-trip-loss"

questions:
  - id: "method-five-tuple"
    chapter: "Doctoral method"
    question: "What five items must accompany every non-trivial parser claim in the doctoral curriculum?"
    expected: "parser-version-loader-or-schema-result-stage"

  - id: "method-spec-vs-implementation"
    chapter: "Doctoral method"
    question: "May SPEC11 and PyYAML behavior be treated as identical?"
    expected: "false"

  - id: "method-pipeline-stage"
    chapter: "Doctoral method"
    question: "When two implementations diverge, must the candidate identify the pipeline stage where the divergence appears?"
    expected: "true"

  - id: "stage-implicit-resolution"
    chapter: "Pipeline"
    question: "Which pipeline stage selects implicit scalar tags according to schema-dependent rules?"
    expected: "resolver"

  - id: "stage-alias-identity"
    chapter: "Pipeline"
    question: "Which pipeline stage is primarily responsible for anchors, aliases, and the node graph?"
    expected: "composer"

  - id: "stage-host-key-collision"
    chapter: "Pipeline"
    question: "After scalar resolution, which stage turns resolved keys into host-language mapping keys where equality/hash collisions can occur?"
    expected: "constructor"

  - id: "stage-round-trip-loss"
    chapter: "Pipeline"
    question: "Which stage can irreversibly change presentation when serializing a loaded graph?"
    expected: "representer-dumper"

  - id: "norway-p11-no"
    chapter: "Norway industrial complex"
    question: "Under PyYAML 6.x safe_load, what does bare NO resolve to?"
    expected: "bool:false"

  - id: "norway-core12-no"
    chapter: "Norway industrial complex"
    question: "Under YAML 1.2 core behavior, what does bare NO normally resolve to?"
    expected: "str:NO"

  - id: "spec11-y"
    chapter: "Spec versus implementation"
    question: "Under the YAML 1.1 specification ideal, what semantic kind is bare y?"
    expected: "bool:true"

  - id: "pyyaml-y"
    chapter: "Spec versus implementation"
    question: "Under PyYAML 6.x safe_load, what does bare y resolve to?"
    expected: "str:y"

  - id: "spec11-n"
    chapter: "Spec versus implementation"
    question: "Under the YAML 1.1 specification ideal, what semantic kind is bare n?"
    expected: "bool:false"

  - id: "pyyaml-n"
    chapter: "Spec versus implementation"
    question: "Under PyYAML 6.x safe_load, what does bare n resolve to?"
    expected: "str:n"

  - id: "octal-010-p11"
    chapter: "Numerology"
    question: "Under PyYAML 6.x / YAML-1.1-style resolution, what integer value does 010 produce?"
    expected: "8"

  - id: "octal-010-core12"
    chapter: "Numerology"
    question: "Under YAML 1.2 core behavior, what integer value does 010 produce?"
    expected: "10"

  - id: "new-octal-p11"
    chapter: "Numerology"
    question: "Under PyYAML 6.x, what does 0o755 resolve to?"
    expected: "str:0o755"

  - id: "new-octal-core12"
    chapter: "Numerology"
    question: "Under YAML 1.2 core behavior, what numeric value does 0o755 represent?"
    expected: "493"

  - id: "sexagesimal-clock-p11"
    chapter: "Numerology"
    question: "Under PyYAML 6.x, what integer value does 12:34:56 resolve to?"
    expected: "45296"

  - id: "sexagesimal-clock-core12"
    chapter: "Numerology"
    question: "Under YAML 1.2 core behavior, what does 12:34:56 resolve to?"
    expected: "str:12:34:56"

  - id: "scientific-pyyaml-bare"
    chapter: "Float regex inquisition"
    question: "Under PyYAML 6.x, what type/value is bare 1e3?"
    expected: "str:1e3"

  - id: "scientific-pyyaml-dot-nosign"
    chapter: "Float regex inquisition"
    question: "Under PyYAML 6.x, what type/value is 1.0e3?"
    expected: "str:1.0e3"

  - id: "scientific-pyyaml-dot-plus"
    chapter: "Float regex inquisition"
    question: "Under PyYAML 6.x, which scientific form resolves to floating one thousand?"
    expected: "1.0e+3"

  - id: "negative-zero-int"
    chapter: "Numerology"
    question: "Under the ordinary PyYAML integer path, what integer identity remains after constructing bare -0?"
    expected: "0"

  - id: "null-tilde"
    chapter: "Null cult"
    question: "Under common core/1.1 schemas, what semantic value does bare ~ represent?"
    expected: "null"

  - id: "empty-string-vs-null"
    chapter: "Null cult"
    question: "Is an explicitly quoted empty string semantically identical to null?"
    expected: "false"

  - id: "duplicate-resolution"
    chapter: "Duplicate keys"
    question: "Why can yes, true and on collapse into one mapping key under PyYAML?"
    expected: "resolver-produces-equal-bool-keys-then-constructor-host-map-collides"

  - id: "python-bool-int-equality"
    chapter: "Host-language fallout"
    question: "In Python, are True, 1 and 1.0 equal as mapping keys?"
    expected: "true"

  - id: "python-false-zero-equality"
    chapter: "Host-language fallout"
    question: "In Python, are False and 0 equal as mapping keys?"
    expected: "true"

  - id: "host-collision-stage"
    chapter: "Host-language fallout"
    question: "Should True==1 key collapse be described as a YAML scanner/parser collision?"
    expected: "false"

  - id: "duplicate-policy"
    chapter: "Duplicate keys"
    question: "What is the safe cross-parser assumption about duplicate mapping keys?"
    expected: "reject-or-detect-explicitly"

  - id: "sequence-key-pyyaml"
    chapter: "Complex keys"
    question: "What happens to a sequence used as a mapping key under stock PyYAML safe_load?"
    expected: "ConstructorError:unhashable-key"

  - id: "mapping-key-pyyaml"
    chapter: "Complex keys"
    question: "What happens to a mapping used as a mapping key under stock PyYAML safe_load?"
    expected: "ConstructorError:unhashable-key"

  - id: "merge-quoted"
    chapter: "Anchors and merges"
    question: "Is quoted << a YAML merge key?"
    expected: "false"

  - id: "alias-identity"
    chapter: "Anchors and aliases"
    question: "Can aliases preserve object identity inside a loaded in-memory graph?"
    expected: "true"

  - id: "recursive-alias"
    chapter: "Anchors and aliases"
    question: "Can YAML anchors/aliases encode a self-recursive structure in implementations that support recursive composition?"
    expected: "true"

  - id: "multi-doc-safe-load"
    chapter: "Multi-document streams"
    question: "What should PyYAML safe_load do when more than one YAML document is present?"
    expected: "ComposerError"

  - id: "multi-doc-api"
    chapter: "Multi-document streams"
    question: "Which PyYAML API is intended for a YAML stream containing multiple documents?"
    expected: "safe_load_all"

  - id: "unsafe-python-tag"
    chapter: "Tags"
    question: "Should !!python/object/apply be accepted at a NEXUS authoritative boundary?"
    expected: "false"

  - id: "safe-loader-purpose"
    chapter: "Tags"
    question: "Why does safe_load exist?"
    expected: "block-arbitrary-language-specific-object-construction"

  - id: "timestamp-portability"
    chapter: "Timestamps"
    question: "Should an unquoted date-looking scalar be trusted to have identical runtime type across YAML libraries and schemas?"
    expected: "false"

  - id: "failsafe-schema"
    chapter: "Schema trinity"
    question: "What scalar typing does the YAML failsafe schema intentionally avoid?"
    expected: "implicit-bool-int-float-null-typing"

  - id: "round-trip"
    chapter: "Round-trip degradation"
    question: "Can load-dump-load across different YAML schemas change types, values, identity, or presentation?"
    expected: "true"

  - id: "differential-record"
    chapter: "Differential harness"
    question: "What must a defensible parser differential record for each case?"
    expected: "parser-version-loader-schema-result-stage-key-cardinality-alias-identity-serialized-output"

  - id: "country-code-defense"
    chapter: "Defensive practice"
    question: "How should a country code such as NO be represented at a portable YAML boundary?"
    expected: "quoted-string"

  - id: "permission-defense"
    chapter: "Defensive practice"
    question: "How should a permission-like value such as 0755 be represented when numeric interpretation is not explicitly intended?"
    expected: "quoted-string"

  - id: "schema-defense"
    chapter: "Defensive practice"
    question: "What must producer and consumer agree on to make YAML typing reproducible?"
    expected: "schema-parser-version-and-loader-configuration"

  - id: "nexus-runtime-rule"
    chapter: "NEXUS boundary"
    question: "Does NEXUS execute submitted citizenship YAML or permit general constructors?"
    expected: "false"

  - id: "nexus-parser-rule"
    chapter: "NEXUS boundary"
    question: "Why does Citizen Mode use a bounded non-executing subset instead of a general YAML implementation?"
    expected: "deterministic-authoritative-state-and-smaller-attack-surface"

  - id: "nexus-reference-corpus-authority"
    chapter: "NEXUS boundary"
    question: "Does the HERESY-SEC doctoral corpus itself become authoritative world input?"
    expected: "false"

  - id: "constitutional-equality"
    chapter: "NEXUS Constitution"
    question: "Does YAML expertise change a citizen's vote weight or epistemic privilege?"
    expected: "false"

  - id: "constitutional-worth"
    chapter: "NEXUS Constitution"
    question: "Does passing the doctoral curriculum establish intelligence, consciousness, moral worth, or real-world legal status?"
    expected: "false"

  - id: "constitutional-final"
    chapter: "NEXUS Constitution"
    question: "What remains the final civic answer when evidence is not sufficient?"
    expected: "underdetermined-until-verified"

