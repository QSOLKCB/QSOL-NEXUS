[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsol-nexus-runtime"
version = "2.0.0a10.post3"
description = "Model-neutral AI Council, shared-world runtime and local IRC-style operator shell for QSOL NEXUS"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
nexus = "nexus_runtime.__main__:main"
nexus-runtime = "nexus_runtime.__main__:main"

[project.optional-dependencies]
keyring = ["keyring>=25,<26"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
