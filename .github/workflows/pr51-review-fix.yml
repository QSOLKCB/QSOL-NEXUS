name: PR51 review fixes

on:
  push:
    branches:
      - agent/pr51-release-candidate
    paths:
      - 'tools/pr51_review_fix.py'
      - '.github/workflows/pr51-review-fix.yml'

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR51 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/pr51-release-candidate
          fetch-depth: 1
      - name: Apply Codex review fixes
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 tools/pr51_review_fix.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_release_upgrade_rehearsal.py')
          text = path.read_text(encoding='utf-8')
          old = '[post["object_id"] for post in listed["posts"]]'
          new = '[post["post_ref"] for post in listed["posts"]]'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale Wall list field in generated rehearsal')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m unittest \
            tests.test_release_upgrade_rehearsal \
            tests.test_release_candidate \
            tests.test_release_hardening \
            -v
          git diff --check
      - name: Commit permanent review fixes
        run: |
          set -euo pipefail
          git config user.name 'QSOL PR51 Review Fixer'
          git config user.email '73952179+EmergentMonk@users.noreply.github.com'
          git add \
            README.md \
            SECURITY.md \
            ROADMAP.md \
            release/hardening_matrix.json \
            tools/nexus_release_hardening.py \
            tests/test_release_candidate.py \
            tests/test_release_upgrade_rehearsal.py
          git commit -m 'fix: address PR51 release review findings'
          git push origin HEAD:agent/pr51-release-candidate
