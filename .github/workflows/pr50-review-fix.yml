name: PR50 review-fix builder

on:
  push:
    branches:
      - agent/pr50-bbs-wall
    paths:
      - 'tools/pr50_review_fix.py'
      - '.github/workflows/pr50-review-fix.yml'

permissions:
  contents: write

jobs:
  fix-review-comments:
    if: github.repository == 'QSOLKCB/QSOL-NEXUS'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/pr50-bbs-wall
          fetch-depth: 1

      - name: Apply deterministic review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/pr50_review_fix.py

      - name: Diagnose non-ASCII AI identity path
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import tempfile
          from nexus_runtime import NexusAPI

          with tempfile.TemporaryDirectory() as temporary:
              base = Path(temporary)
              api = NexusAPI(
                  base / 'world',
                  auth_root=base / 'auth',
                  trap_root=base / 'trap',
                  stenographer_root=base / 'stenographer',
                  guardian_root=base / 'guardian',
              )
              member = {
                  'member_id': 'Alpha / Ω:seat',
                  'model_id': 'mock/模型 alpha',
                  'adapter_id': 'mock',
                  'profile': 'balanced',
              }
              print(api.handle({'operation': 'wall.ai_post', 'member': member, 'prompt': 'Leave a short note.'}))
          PY

      - name: Run focused Python Wall regressions
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_wall.py' -v

      - name: Run focused Rust Wall regressions and format check
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path tui/Cargo.toml --test wall
          cargo fmt --manifest-path tui/Cargo.toml -- --check

      - name: Remove one-shot builder and commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch tools/pr50_review_fix.py .github/workflows/pr50-review-fix.yml
          git config user.name 'QSOL PR50 Review Fixer'
          git config user.email '73952179+EmergentMonk@users.noreply.github.com'
          git add -A
          git commit -m 'fix: address PR50 Wall review findings'
          git push origin HEAD:agent/pr50-bbs-wall
