name: Public QSOL observatory smoke tests

on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/portal.css'
      - 'docs/portal.js'
      - 'docs/PUBLIC_WEB.md'
      - 'docs/research.html'
      - 'docs/research.css'
      - 'docs/research.js'
      - 'docs/research-data.js'
      - 'docs/NOTION_OBSERVATORY.md'
      - 'tools/notion_public_export.py'
      - 'index.html'
      - 'web_tests/**'
      - '.github/workflows/public-observatory.yml'
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/portal.css'
      - 'docs/portal.js'
      - 'docs/PUBLIC_WEB.md'
      - 'docs/research.html'
      - 'docs/research.css'
      - 'docs/research.js'
      - 'docs/research-data.js'
      - 'docs/NOTION_OBSERVATORY.md'
      - 'tools/notion_public_export.py'
      - 'index.html'
      - 'web_tests/**'
      - '.github/workflows/public-observatory.yml'

permissions:
  contents: read

jobs:
  public-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate public portal and research projection
        run: python3 -B -m unittest discover -s web_tests -p 'test_*.py' -v
