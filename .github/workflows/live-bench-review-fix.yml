name: One-shot live bench review fix

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/live-hardware-council-bench' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply review fixes
        run: python3 .github/scripts/fix_live_bench_reviews.py

      - name: Run live-bench regressions
        env:
          PYTHONPATH: src
        run: python3 -m unittest tests/test_live_council_bench.py -v

      - name: Run full Python suite
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run adversarial gauntlet
        run: |
          python3 tools/nexus_adversary.py \
            --profile full \
            --seed 0x4E45585553 \
            --iterations 512 \
            --json-out /tmp/nexus-adversarial-gauntlet.json

      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/nexus_live_council_bench.py tests/test_live_council_bench.py
          if git diff --cached --quiet; then
            echo 'No review changes to commit.'
            exit 0
          fi
          git commit -m 'Harden live hardware bench review paths'
          git push origin HEAD:${{ github.head_ref }}
