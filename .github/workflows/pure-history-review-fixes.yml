name: One-shot Pure History review fixes

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/pure-history-mode' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply review fixes
        run: python3 .github/scripts/fix_pure_history_review.py
      - name: Python tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Mock Council demo
        env:
          PYTHONPATH: src
        run: python3 -m nexus_runtime --demo > /tmp/nexus-demo.json
      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nexus_runtime/council.py src/nexus_runtime/history_guard.py tests/test_pure_history.py
          if git diff --cached --quiet; then
            echo 'No review changes to commit.'
            exit 0
          fi
          git commit -m 'Address Pure History review findings'
          git push origin HEAD:${{ github.head_ref }}
