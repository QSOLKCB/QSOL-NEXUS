name: One-shot Failsafe integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/failsafe-shadow-realm' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply Failsafe integration
        run: python3 .github/scripts/apply_failsafe.py

      - name: Rust format
        run: cargo fmt --manifest-path tui/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path tui/Cargo.toml --all-targets

      - name: Rust compile check
        run: cargo check --manifest-path tui/Cargo.toml --all-targets

      - name: Python regression suite
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Mock Council demo
        env:
          PYTHONPATH: src
        run: python3 -m nexus_runtime --demo > /tmp/nexus-demo.json

      - name: Commit Failsafe integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/nexus_runtime/council.py \
            src/nexus_runtime/api.py \
            tests/test_runtime.py \
            tests/test_un_sim.py \
            tests/test_mud.py \
            tui/Cargo.toml \
            tui/Cargo.lock \
            tui/src/main.rs \
            README.md \
            ROADMAP.md \
            CHANGELOG.md \
            docs/API.md
          if git diff --cached --quiet; then
            echo 'No Failsafe integration changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate NEXUS Failsafe and Shadow Realm'
          git push origin HEAD:${{ github.head_ref }}
