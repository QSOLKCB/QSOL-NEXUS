name: PR52 Codex review fixes

on:
  push:
    branches:
      - agent/pr52-post-merge-audit-closure
    paths:
      - 'tools/pr52_codex_review_fix.py'
      - '.github/workflows/pr52-codex-review-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR52 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/pr52-post-merge-audit-closure
          fetch-depth: 1

      - name: Apply Codex review fixes
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 tools/pr52_codex_review_fix.py
          python3 -m unittest \
            tests.test_post_merge_grok_audit \
            tests.test_release_candidate \
            tests.test_release_hardening \
            tests.test_release_hardening_grok_audit \
            -v
          git diff --check

      - name: Commit permanent Codex review fixes
        run: |
          set -euo pipefail
          git config user.name 'QSOL PR52 Codex Fixer'
          git config user.email '73952179+EmergentMonk@users.noreply.github.com'
          git add \
            tools/nexus_release_hardening.py \
            tests/test_post_merge_grok_audit.py \
            SECURITY.md \
            HOWTO.md \
            docs/RELEASE_NOTES_2.0.0.md \
            CHANGELOG.md
          git commit -m 'fix: address PR52 Codex release findings'
          git push origin HEAD:agent/pr52-post-merge-audit-closure
