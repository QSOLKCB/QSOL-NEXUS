name: One-shot PR8 Copilot fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/un-sim-game-room' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/un-sim-game-room

      - name: Apply review fixes
        run: python3 .github/scripts/address_pr8_copilot.py

      - name: Rust format
        run: cargo fmt --manifest-path tui/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path tui/Cargo.toml --all-targets

      - name: Rust compile check
        run: cargo check --manifest-path tui/Cargo.toml --all-targets

      - name: Python tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tui/src/main.rs src/nexus_runtime/game_un.py tests/test_un_sim.py
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Address Copilot review feedback on UN sim invariants"
          git push origin HEAD:agent/un-sim-game-room
