name: One-shot GO64 integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/go64-secret-alias' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply GO64 integration
        run: python3 .github/scripts/apply_go64.py

      - name: Rust format
        run: cargo fmt --manifest-path tui/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path tui/Cargo.toml --all-targets

      - name: Rust compile check
        run: cargo check --manifest-path tui/Cargo.toml --all-targets

      - name: Python regression suite
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Mock Council demo
        env:
          PYTHONPATH: src
        run: python3 -m nexus_runtime --demo > /tmp/nexus-demo.json

      - name: Commit GO64 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            ROADMAP.md \
            CHANGELOG.md \
            docs/IRC_TUI.md \
            tui/Cargo.lock \
            tui/src/lib.rs \
            tui/src/main.rs \
            tui/src/go64.rs \
            tui/tests/go64.rs
          if git diff --cached --quiet; then
            echo 'No GO64 integration changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate GO64 secret alias mode'
          git push origin HEAD:${{ github.head_ref }}
