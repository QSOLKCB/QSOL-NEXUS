name: One-shot GO64 overlay hardening

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'agent/go64-secret-alias' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply GO64 overlay hardening
        run: python3 .github/scripts/harden_go64_overlay.py

      - name: Rust format
        run: cargo fmt --manifest-path tui/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path tui/Cargo.toml --all-targets

      - name: Rust compile check
        run: cargo check --manifest-path tui/Cargo.toml --all-targets

      - name: Python regression suite
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit GO64 hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tui/src/go64.rs tui/src/main.rs
          if git diff --cached --quiet; then
            echo 'No GO64 hardening changes to commit.'
            exit 0
          fi
          git commit -m 'Harden GO64 overlay boundary'
          git push origin HEAD:${{ github.head_ref }}
