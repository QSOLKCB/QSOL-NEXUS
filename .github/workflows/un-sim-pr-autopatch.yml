name: One-shot UN sim PR autopatch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply focused UN sim TUI patch
        run: python3 .github/scripts/patch_un_sim_tui.py

      - name: Format and test
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tui/Cargo.toml
          cargo test --manifest-path tui/Cargo.toml --all-targets
          cargo check --manifest-path tui/Cargo.toml --all-targets
          python3 -m unittest discover -s tests -v

      - name: Commit generated source edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tui/src/lib.rs tui/src/main.rs tests/test_runtime.py
          git diff --cached --quiet && exit 0
          git commit -m 'Wire #un-sim game room into Rust TUI'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
