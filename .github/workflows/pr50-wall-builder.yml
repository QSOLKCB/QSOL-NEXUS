name: PR50 one-shot Wall builder

on:
  push:
    branches:
      - agent/pr50-bbs-wall
    paths:
      - 'tools/pr50_wall_builder.py'
      - '.github/workflows/pr50-wall-builder.yml'

permissions:
  contents: write

jobs:
  build-wall:
    if: github.repository == 'QSOLKCB/QSOL-NEXUS'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/pr50-bbs-wall
          fetch-depth: 1

      - name: Apply deterministic one-shot Wall build
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f tools/pr50_wall_builder.py; then
            echo 'one-shot builder already consumed; nothing to do'
            exit 0
          fi
          python3 tools/pr50_wall_builder.py

      - name: Format and run focused Wall regressions
        if: hashFiles('tools/pr50_wall_builder.py') == ''
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_wall.py' -v
          cargo fmt --manifest-path tui/Cargo.toml
          cargo test --manifest-path tui/Cargo.toml --test wall

      - name: Commit generated Wall implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'no generated changes to commit'
            exit 0
          fi
          git config user.name 'QSOL PR50 Builder'
          git config user.email '73952179+EmergentMonk@users.noreply.github.com'
          git add -A
          git commit -m 'feat: build NEXUS BBS Wall'
          git push origin HEAD:agent/pr50-bbs-wall
