name: PR21 Trap hardening integration

on:
  push:
    branches:
      - agent/pr21-trap-review-hardening

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed hardening patch
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_pr21_trap_hardening.py
          python3 .github/scripts/postfix_pr21_trap_hardening.py

      - name: Focused Codex regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        run: python3 -m unittest tests.test_trap_review_hardening -v

      - name: Full Python regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v

      - name: Adversarial Trap probes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        run: python3 tools/nexus_adversary.py --profile probes --seed 0x4E45585553 --iterations 512

      - name: Hermetic Trap acceptance bundle
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          trap_tmp="$(mktemp -d)"
          python3 tools/nexus_trap_demo.py \
            --report-dir "$trap_tmp/report" \
            --archive "$trap_tmp/nexus-trap-base.tar.gz" \
            --fake-subject \
            --skip-regression
          tar -tzf "$trap_tmp/nexus-trap-base.tar.gz" >/dev/null

      - name: Diff hygiene
        run: git diff --check

      - name: Remove one-shot integration helpers
        run: |
          rm .github/scripts/apply_pr21_trap_hardening.py
          rm .github/scripts/postfix_pr21_trap_hardening.py
          rm .github/workflows/pr21-trap-hardening-integration.yml

      - name: Commit permanent hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Trap Base review boundaries"
          git push origin HEAD:agent/pr21-trap-review-hardening
