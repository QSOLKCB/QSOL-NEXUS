name: One-shot rustfmt autofix

on:
  push:
    branches:
      - agent/rust-irc-tui
    paths:
      - 'tui/src/**'
      - '.github/workflows/rustfmt-autofix.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-irc-tui
      - name: Add decompressed archive-member bound
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('tui/src/lib.rs')
          text = path.read_text()

          constant = 'pub const MAX_UPLOAD_BYTES: u64 = 8 * 1024 * 1024;\n'
          if 'MAX_ARCHIVE_MEMBER_BYTES' not in text:
              if constant not in text:
                  raise SystemExit('MAX_UPLOAD_BYTES anchor not found')
              text = text.replace(
                  constant,
                  constant + 'pub const MAX_ARCHIVE_MEMBER_BYTES: u64 = 8 * 1024 * 1024;\n',
                  1,
              )

          if 'document member {member} expands to' not in text:
              pattern = re.compile(
                  r'(\s+let mut entry = archive\s*\n'
                  r'\s*\.by_name\(member\)\s*\n'
                  r'\s*\.map_err\(\|e\| format!\("document is missing \{member\}: \{e\}"\)\)\?;\s*\n)'
              )
              match = pattern.search(text)
              if not match:
                  location = text.find('.by_name(member)')
                  print('Current content around .by_name(member):')
                  if location >= 0:
                      print(text[max(0, location - 160): location + 260])
                  else:
                      print('.by_name(member) not present')
                  raise SystemExit('ZIP member anchor not found')

              guard = '''    if entry.size() > MAX_ARCHIVE_MEMBER_BYTES {
              return Err(format!(
                  "document member {member} expands to {} bytes; limit is {} bytes",
                  entry.size(),
                  MAX_ARCHIVE_MEMBER_BYTES
              ));
          }
          '''
              text = text[:match.end()] + guard + text[match.end():]

          path.write_text(text)
          PY
      - name: Apply rustfmt
        run: cargo fmt --manifest-path tui/Cargo.toml
      - name: Commit hardened formatted Rust sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tui/src; then
            echo 'Rust sources already formatted and hardened.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tui/src
          git commit -m 'Harden and format IRC TUI document ingestion'
          git push origin HEAD:agent/rust-irc-tui
