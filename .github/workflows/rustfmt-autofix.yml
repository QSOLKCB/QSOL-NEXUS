name: One-shot rustfmt autofix

on:
  push:
    branches:
      - agent/rust-irc-tui
    paths:
      - 'tui/src/**'
      - '.github/workflows/rustfmt-autofix.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-irc-tui
      - name: Apply rustfmt
        run: cargo fmt --manifest-path tui/Cargo.toml
      - name: Commit formatted Rust sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tui/src; then
            echo 'Rust sources already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tui/src
          git commit -m 'Apply rustfmt to IRC TUI'
          git push origin HEAD:agent/rust-irc-tui
