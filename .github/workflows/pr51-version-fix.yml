name: PR51 version assertion fixer

on:
  push:
    branches:
      - agent/pr51-release-candidate
    paths:
      - 'tools/pr51_version_assertion_fix.py'
      - '.github/workflows/pr51-version-fix.yml'

permissions:
  contents: write

jobs:
  fix-stale-release-assertions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR51 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/pr51-release-candidate
          fetch-depth: 1
      - name: Apply exact stale-version replacements
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 tools/pr51_version_assertion_fix.py
          python3 -m unittest tests.test_runtime.APITests.test_health_reports_all_network_paths_and_council_limits -v
          python3 -m unittest tests.test_un_sim.UNSimulationAPITests.test_api_exposes_game_mode_region_and_operations -v
          git diff --check
      - name: Commit permanent test fixes
        run: |
          set -euo pipefail
          git config user.name 'QSOL PR51 Version Fixer'
          git config user.email '73952179+EmergentMonk@users.noreply.github.com'
          git add tests/test_runtime.py tests/test_un_sim.py
          git commit -m 'test: align final candidate runtime version assertions'
          git push origin HEAD:agent/pr51-release-candidate
