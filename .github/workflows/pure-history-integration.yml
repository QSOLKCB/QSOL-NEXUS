name: One-shot Pure History integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/pure-history-mode' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply Pure History integration
        run: python3 .github/scripts/apply_pure_history_v2.py
      - name: Rust format
        run: cargo fmt --manifest-path tui/Cargo.toml
      - name: Rust tests
        run: cargo test --manifest-path tui/Cargo.toml --all-targets
      - name: Rust compile check
        run: cargo check --manifest-path tui/Cargo.toml --all-targets
      - name: Python tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Mock Council demo
        env:
          PYTHONPATH: src
        run: python3 -m nexus_runtime --demo > /tmp/nexus-demo.json
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            CHANGELOG.md \
            docs/API.md \
            docs/IRC_TUI.md \
            docs/MODES_GEOMETRY.md \
            src/nexus_runtime/api.py \
            src/nexus_runtime/adapters/ollama.py \
            src/nexus_runtime/council.py \
            src/nexus_runtime/mock.py \
            src/nexus_runtime/modes.py \
            tests/test_adapters.py \
            tests/test_modes_geometry.py \
            tests/test_mud.py \
            tests/test_runtime.py \
            tests/test_un_sim.py \
            tui/src/lib.rs \
            tui/src/main.rs
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'Implement Pure History mode'
          git push origin HEAD:${{ github.head_ref }}
