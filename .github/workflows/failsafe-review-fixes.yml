name: One-shot Failsafe review fixes

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  review-fixes:
    if: github.head_ref == 'agent/failsafe-shadow-realm' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply Copilot and Codex fixes
        run: python3 .github/scripts/apply_failsafe_review_fixes.py

      - name: Rust format
        run: cargo fmt --manifest-path tui/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path tui/Cargo.toml --all-targets

      - name: Rust compile check
        run: cargo check --manifest-path tui/Cargo.toml --all-targets

      - name: Python regression suite
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Mock Council demo
        env:
          PYTHONPATH: src
        run: python3 -m nexus_runtime --demo > /tmp/nexus-demo.json

      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/nexus_runtime/failsafe.py \
            tests/test_failsafe.py \
            tests/test_runtime.py \
            tui/src/main.rs \
            docs/FAILSAFE.md
          if git diff --cached --quiet; then
            echo 'No review-fix changes to commit.'
            exit 0
          fi
          git commit -m 'Harden Failsafe persistence and rehabilitation'
          git push origin HEAD:${{ github.head_ref }}
