name: NEXUS 2.0 release hardening

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'nexus'
      - 'pyproject.toml'
      - 'rust-toolchain.toml'
      - 'release/**'
      - 'src/nexus_runtime/**'
      - 'tests/**'
      - 'tools/**'
      - 'tui/**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-wall-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HARDENING_REPORT: ${{ runner.temp }}/nexus-release-hardening-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          cargo --version
          rustc --version
          test "$(cargo --version | awk '{print $2}')" = "1.97.1"
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"

      - name: Run pre-stable hardening matrix
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 tools/nexus_release_hardening.py \
            --iterations 128 \
            --json-out "$HARDENING_REPORT"

      - name: Show machine-readable report
        if: always()
        shell: bash
        run: |
          if test -f "$HARDENING_REPORT"; then
            cat "$HARDENING_REPORT"
          else
            echo 'release hardening report was not produced'
          fi

      - name: Upload machine-readable hardening report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexus-release-hardening-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HARDENING_REPORT }}
          if-no-files-found: warn
          retention-days: 30
