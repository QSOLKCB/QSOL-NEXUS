name: NEXUS 2.0 release candidate

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'nexus'
      - '*.md'
      - 'CITATION.cff'
      - 'docs/**'
      - 'pyproject.toml'
      - 'rust-toolchain.toml'
      - 'release/**'
      - 'src/nexus_runtime/**'
      - 'tests/**'
      - 'tools/**'
      - 'tui/**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-candidate-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout complete release history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Initialize job-unique hardening report path
        shell: bash
        run: |
          set -euo pipefail
          printf 'HARDENING_REPORT=%s\n' "$RUNNER_TEMP/nexus-release-hardening-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" >> "$GITHUB_ENV"

      - name: Select frozen v2.0 hardening subject
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nexus-v2.0-hardening-baseline"
          git worktree add --detach "$root" cc6b4ffee26760e8d7c3bc88a2fcb877559e5d6a
          printf 'HARDENING_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
          printf 'HARDENING_EXPECT=%s\n' 'cc6b4ffee26760e8d7c3bc88a2fcb877559e5d6a' >> "$GITHUB_ENV"
          printf 'HARDENING_SUBJECT=%s\n' 'frozen-v2.0.0-commit' >> "$GITHUB_ENV"

      - name: Toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          cargo --version
          rustc --version
          test "$(cargo --version | awk '{print $2}')" = "1.97.1"
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"

      - name: Run frozen v2.0 exact-commit release-candidate matrix
        shell: bash
        run: |
          set -euo pipefail
          cd "$HARDENING_ROOT"
          PYTHONPATH=src python3 tools/nexus_release_hardening.py \
            --iterations 128 \
            --expect-commit "$HARDENING_EXPECT" \
            --json-out "$HARDENING_REPORT"

      - name: Show verification subject and machine-readable report
        if: always()
        shell: bash
        run: |
          echo "release-hardening subject: ${HARDENING_SUBJECT:-unknown}"
          if test -f "$HARDENING_REPORT"; then
            cat "$HARDENING_REPORT"
          else
            echo 'release hardening report was not produced'
          fi

      - name: Upload machine-readable hardening report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexus-release-hardening-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HARDENING_REPORT }}
          if-no-files-found: warn
          retention-days: 30
