name: One-shot alpha6 artifact cleanup

on:
  push:
    branches:
      - agent/council-information-telemetry
    paths:
      - '.github/workflows/alpha6-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alpha6 branch
        uses: actions/checkout@v4
        with:
          ref: agent/council-information-telemetry

      - name: Remove generated build products and add ignore rules
        shell: bash
        run: |
          set -euo pipefail
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf tui/target
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          tui/target/
          .nexus-world/
          EOF
          rm -f .github/workflows/alpha6-cleanup.yml

      - name: Commit clean alpha6 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove generated artifacts from alpha6 branch'
          git push origin HEAD:agent/council-information-telemetry
