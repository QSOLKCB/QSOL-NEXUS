name: README dual-surface contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  readme-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate README dual-surface contract
        uses: ./.github/actions/readme-contract
