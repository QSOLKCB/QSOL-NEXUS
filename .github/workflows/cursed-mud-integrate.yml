name: One-shot cursed MUD integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/cursed-mud-game-room' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply cursed MUD integration
        run: python3 .github/scripts/implement_cursed_mud.py
      - name: Rust format
        run: cargo fmt --manifest-path tui/Cargo.toml
      - name: Rust tests
        run: cargo test --manifest-path tui/Cargo.toml --all-targets
      - name: Rust compile check
        run: cargo check --manifest-path tui/Cargo.toml --all-targets
      - name: Python tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit integrated MUD
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nexus_runtime/api.py src/nexus_runtime/modes.py src/nexus_runtime/geometry.py tests/test_modes_geometry.py tests/test_un_sim.py tui/src/lib.rs tui/src/main.rs tui/tests/mud.rs
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate HERESY MUD into runtime and TUI'
          git push origin HEAD:${{ github.head_ref }}
