name: Lean 4 formal verification

on:
  push:
    branches:
      - agent/pr52-lean4-formal-verification
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  pull_request:
    branches:
      - main
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_VERSION: "4.33.0"
  LEAN_LINUX_SHA256: "4b3fb03c29a1e0a253fb1d11f9bae3725f19a0dc6fc09b3ea16d2c9df3349e2c"

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reject proof holes and user-declared axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)' formal/lean --include='*.lean'; then
            echo 'Lean formalization contains a forbidden proof hole or user-declared axiom.' >&2
            exit 1
          fi

      - name: Install pinned official Lean release
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/lean-${LEAN_VERSION}-linux.tar.zst"
          dist="/tmp/nexus-lean-dist"
          curl -fsSL --retry 5 --retry-delay 2 \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst" \
            -o "$archive"
          printf '%s  %s\n' "$LEAN_LINUX_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$dist"
          tar --zstd -xf "$archive" -C "$dist"
          printf '%s\n' "$dist/lean-${LEAN_VERSION}-linux/bin" >> "$GITHUB_PATH"

      - name: Verify pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
          test "$(cat formal/lean/lean-toolchain)" = "leanprover/lean4:v${LEAN_VERSION}"

      - name: Build and kernel-check complete theorem surface
        shell: bash
        working-directory: formal/lean
        run: |
          set -euo pipefail
          lake build

      - name: Compile aggregate theorem module directly
        shell: bash
        working-directory: formal/lean
        run: |
          set -euo pipefail
          lake env lean Nexus/Main.lean
