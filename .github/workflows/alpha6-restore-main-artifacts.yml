name: One-shot restore pre-existing main artifacts

on:
  push:
    branches:
      - agent/council-information-telemetry
    paths:
      - '.github/workflows/alpha6-restore-main-artifacts.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alpha6 branch
        uses: actions/checkout@v4
        with:
          ref: agent/council-information-telemetry
          fetch-depth: 0

      - name: Restore generated files already present on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            src/nexus_runtime/__pycache__ \
            src/nexus_runtime/adapters/__pycache__ \
            tests/__pycache__ \
            tui/target
          rm -f .github/workflows/alpha6-restore-main-artifacts.yml

      - name: Commit focused alpha6 diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep alpha6 telemetry diff focused'
          git push origin HEAD:agent/council-information-telemetry
