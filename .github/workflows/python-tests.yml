name: Python mock runtime tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Python version
        run: python3 --version
      - name: Validate machine README manifest
        run: python3 tools/validate_readme_contract.py
      - name: Require README4AI update when README changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/validate_readme_contract.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
      - name: Mock Council demo
        env:
          PYTHONPATH: src
        run: python3 -m nexus_runtime --demo > /tmp/nexus-demo.json
      - name: Hermetic Trap Base structural demo
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          trap_tmp="$(mktemp -d)"
          python3 tools/nexus_trap_demo.py \
            --report-dir "$trap_tmp/report" \
            --archive "$trap_tmp/nexus-trap-base.tar.gz" \
            --fake-subject \
            --skip-regression
          tar -tzf "$trap_tmp/nexus-trap-base.tar.gz" >/dev/null
