name: One-shot gauntlet live invocation fix

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/adversarial-gauntlet-runner' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Patch live profile invocation
        run: python3 .github/scripts/fix_gauntlet_live.py

      - name: Run probe profile
        run: python3 tools/nexus_adversary.py --profile probes --iterations 256 --json-out /tmp/gauntlet-probes.json

      - name: Commit live profile fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/nexus_adversary.py
          if git diff --cached --quiet; then
            echo 'No gauntlet live-profile change to commit.'
            exit 0
          fi
          git commit -m 'Fix adversarial live profile discovery'
          git push origin HEAD:${{ github.head_ref }}
