name: One-shot PR5 Copilot review fixes

on:
  push:
    branches:
      - agent/rust-irc-tui
    paths:
      - '.github/scripts/apply-pr5-copilot-fixes.py'
      - '.github/workflows/pr5-copilot-autofix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-irc-tui
      - name: Apply review fixes
        run: python3 .github/scripts/apply-pr5-copilot-fixes.py
      - name: Format Rust
        run: cargo fmt --manifest-path tui/Cargo.toml
      - name: Rust unit tests
        run: cargo test --manifest-path tui/Cargo.toml --all-targets
      - name: Rust compile check
        run: cargo check --manifest-path tui/Cargo.toml --all-targets
      - name: Python protocol tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Remove one-shot helper and commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply-pr5-copilot-fixes.py .github/workflows/pr5-copilot-autofix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Address Copilot review comments on IRC TUI'
          git push origin HEAD:agent/rust-irc-tui
